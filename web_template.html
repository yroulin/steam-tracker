<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10151b">
<meta name="description" content="Biblioteca de Steam para varias cuentas y Steam Families.">
<link rel="icon" type="image/svg+xml" href="https://store.akamai.steamstatic.com/public/shared/images/header/logo_steam.svg">
<title>Biblioteca Steam</title>
<style>
  :root{color-scheme:dark;--bg:#1b2838;--panel:#17212d;--panel-hi:#202f40;--line:#2a3f52;--text:#edf3f8;--muted:#a3b5c8;--blue:#66c0f4;--blue-deep:#2a475e;--green:#8ee1b1;--gold:#f4c46b;--violet:#c8a7ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
  header,.wrap{width:min(1440px,100%);margin-inline:auto;padding-inline:clamp(16px,3vw,40px)}
  header{padding-top:24px}
  .steam-brand{display:flex;align-items:center;min-height:42px;margin-bottom:14px}
  .steam-brand img{display:block;width:112px;height:auto;filter:brightness(0) invert(1)}
  .steam-hero{position:relative;isolation:isolate;overflow:hidden;margin-bottom:0;aspect-ratio:10/3;min-height:185px;background:#1b2838;border:1px solid #344b60;border-bottom:0}
  .steam-hero::before{content:"";position:absolute;z-index:-1;inset:0;background-image:var(--steam-hero-art);background-size:cover;background-position:center top}
  .library-summary{padding:14px clamp(16px,2.5vw,32px) 2px;background:#1b2838;border:1px solid #344b60;border-top:0;margin-bottom:16px}
  h1{margin:0;font-size:clamp(26px,4vw,38px);line-height:1.12;letter-spacing:-.035em;font-weight:750}
  h1 span{color:var(--blue)}
  .meta{color:var(--muted);font-size:13px;margin:8px 0 22px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:10px;margin-bottom:18px}
  .stat{background:rgba(23,33,45,.82);border:1px solid #486077;border-radius:3px;padding:12px 15px;min-width:0}
  .stat b{display:block;font-size:clamp(20px,2.5vw,25px);line-height:1.15;color:var(--blue);font-variant-numeric:tabular-nums}
  .stat small{display:block;margin-top:6px;color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em}
  .events-panel{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(0,2fr);gap:14px;margin:0 0 16px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:3px}
  .sale-countdown{display:flex;flex-direction:column;justify-content:center;min-height:150px;padding:16px;background:#101822;border:1px solid #344b60;border-radius:2px}
  .sale-countdown .eyebrow,.event-kind{color:var(--muted);font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.09em}
  .sale-countdown h2{margin:8px 0 4px;font-size:18px;line-height:1.25}
  .sale-countdown p{margin:0;color:var(--blue);font-size:14px;font-variant-numeric:tabular-nums;font-weight:700}
  .sale-countdown a,.event-source{color:var(--blue);font-size:12px;font-weight:650;text-underline-offset:3px}
  .sale-countdown a{margin-top:12px}
  .events-content{min-width:0}
  .events-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 9px}
  .events-heading h2{margin:0;font-size:14px}
  .event-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .event-card{display:grid;grid-template-columns:54px minmax(0,1fr);align-items:center;gap:10px;min-width:0;padding:10px;background:#101822;border:1px solid #2d4050;border-radius:2px}
  .event-art{position:relative;display:grid;place-items:center;width:54px;height:54px;overflow:hidden;border:1px solid #52728b;background:linear-gradient(145deg,#315778,#172b3b);color:#b8e5ff}
  .event-art svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .event-art-cooking{background:linear-gradient(145deg,#895c37,#382a2b);color:#ffdc9b;border-color:#9d7550}
  .event-art-nextfest{background:linear-gradient(145deg,#55467f,#1d2c52);color:#d4c5ff;border-color:#72649d}
  .event-art-halloween{background:linear-gradient(145deg,#6e4736,#28213b);color:#ffd08d;border-color:#8d654c}
  .event-art-racing{background:linear-gradient(145deg,#287078,#183442);color:#a8ece1;border-color:#477f86}
  .event-art-sale{background:linear-gradient(145deg,#805a2f,#3a2d24);color:#ffdc9b;border-color:#967540}
  .event-art-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .event-copy{min-width:0}
  .event-card h3{margin:3px 0 4px;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
  .event-card p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}
  .event-card.sale{border-color:#6e5836}
  .event-card.sale .event-kind{color:var(--gold)}
  .event-card.active{border-color:#34769a;background:#14232c}
  .event-card.active .event-kind{color:var(--green)}
  .back-to-top{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:48px;min-height:48px;padding:0 15px;border:1px solid #7ac7ec;background:#1b4d68;color:#f1f7fc;font:inherit;font-size:13px;font-weight:700;box-shadow:0 4px 16px #0008;cursor:pointer}
  .back-to-top:hover{background:#286987}
  .back-to-top:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .back-to-top svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .back-to-top[hidden]{display:none}
  .events-more{margin-top:8px}
  .events-more summary{width:max-content;min-height:40px;display:flex;align-items:center;cursor:pointer;color:var(--blue);font-size:12px;font-weight:650}
  .events-more .event-grid{margin-top:6px}
  .controls{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px;margin-bottom:16px}
  .primary-controls{display:grid;grid-template-columns:minmax(200px,1fr) minmax(190px,.8fr) minmax(170px,.65fr) auto;gap:9px}
  .account-legend{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .account-legend-title{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:2px}
  .account-chip{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 8px;background:#101822;border:1px solid #2c4051;color:#c6d4df;font-size:11px;line-height:1.2;border-radius:2px}
  .account-chip.selected{border-color:var(--blue);background:#223b50;color:#fff}
  .account-avatar-shell{display:inline-flex;width:18px;height:18px;flex:0 0 18px;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;background:#30465a;vertical-align:middle}
  .account-avatar{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}
  .account-avatar-fallback{display:inline-flex;width:18px;height:18px;flex:0 0 18px;align-items:center;justify-content:center;border-radius:50%;background:#30465a;color:#d8e7f4;font-size:9px;font-weight:750;text-transform:uppercase}
  .account-avatar[hidden],.account-avatar-fallback[hidden]{display:none}
  .badge .account-avatar-shell,.badge .account-avatar-fallback{width:16px;height:16px;flex-basis:16px}
  input[type=search],input[type=number],select{width:100%;min-height:44px;background:#101822;color:var(--text);border:1px solid #0b1118;border-radius:2px;padding:9px 12px;font:inherit;font-size:14px}
  input[type=search]::placeholder{color:#8393a0}
  input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .btn{background:#2a475e;color:#f3fbff;border:1px solid #66c0f455;border-radius:2px;padding:9px 14px;min-height:44px;cursor:pointer;font-size:14px;font-weight:650}
  .btn:hover{background:#365b78}
  .advanced{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .advanced summary{cursor:pointer;color:var(--blue);font-weight:650;padding:6px 4px;min-height:44px;display:flex;align-items:center}
  .advanced summary::marker{color:var(--blue)}
  .filter-grid{display:flex;gap:9px 18px;flex-wrap:wrap;padding:8px 4px 4px}
  label.chk{display:flex;align-items:center;gap:8px;cursor:pointer;color:#c4ced7;min-height:44px;user-select:none;font-size:13px}
  label.chk input{width:17px;height:17px;accent-color:var(--blue)}
  label.chk input[type=number]{width:78px;min-height:38px}
  .wrap{padding-bottom:48px}
  .count{color:var(--muted);font-size:13px;margin:0 0 9px}
  table{width:100%;border-collapse:separate;border-spacing:0;border-inline:1px solid #344b60;font-size:13px}
  thead th{background:#17212d;text-align:left;padding:11px 10px;border-block:1px solid var(--line);color:#aab8c4;font-size:10px;font-weight:750;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;white-space:nowrap}
  thead th:first-child{border-radius:10px 0 0 0} thead th:last-child{border-radius:0 10px 0 0}
  thead th:hover{color:var(--blue)}
  .sort-button{display:block;width:100%;min-height:38px;padding:0;border:0;background:transparent;color:inherit;font:inherit;text-align:inherit;text-transform:inherit;letter-spacing:inherit;cursor:pointer}
  th[aria-sort] .sort-button::after{margin-left:.35em;color:var(--blue)}
  th[aria-sort="ascending"] .sort-button::after{content:"↑"}
  th[aria-sort="descending"] .sort-button::after{content:"↓"}
  tbody td{padding:13px 11px;border-bottom:1px solid #26313b;vertical-align:middle}
  tbody tr:nth-child(odd){background:#192736}
  tbody tr:nth-child(even){background:#141e28}
  tbody tr:hover{background:#223d53}
  td.gameCell{min-width:215px}
  .game-cell-content{display:flex;align-items:center;gap:11px;min-width:215px}
  .cover{width:72px;height:34px;object-fit:cover;border-radius:5px;background:#222e39;border:1px solid var(--line);flex:0 0 auto}
  .cover.icon{object-fit:contain;padding:3px}.cover.ph{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);font-size:15px;background:#222e39}
  .gmeta{min-width:0}.game{font-weight:650;color:var(--text);text-decoration:none}.game:hover{color:var(--blue);text-decoration:underline;text-underline-offset:3px}.gameCell a{font-weight:650;color:var(--text);text-decoration:none}.gameCell a:hover{color:var(--blue);text-decoration:underline;text-underline-offset:3px}.appid{color:#8796a3;font-size:11px;margin-top:2px}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.hours{color:var(--green);font-weight:700}.zero{color:var(--muted)}
  .badge{display:inline-flex;align-items:center;gap:5px;background:#202a34;border:1px solid #35424e;border-radius:999px;padding:4px 9px;margin:2px 3px 2px 0;font-size:11px;color:#c1ccd5;white-space:nowrap}
  .badge.multi{border-color:#967540;color:var(--gold)}.badge.fam{border-color:#735a9c;color:var(--violet)}
  .pct{color:var(--muted);font-size:11px}.flag{width:15px;height:11px;object-fit:cover;border-radius:2px;vertical-align:middle}.muted{color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px}
  .mobile-games{display:none}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .game-card{min-width:0;background:#17212d;border:1px solid var(--line);border-left:3px solid #3d6179;border-radius:2px;padding:13px}
  .game-card:nth-child(even){background:#141e28}
  .card-head{display:flex;align-items:center;gap:11px;padding-bottom:11px;border-bottom:1px solid #35424d}
  .card-title{margin:0;font-size:16px;line-height:1.3;font-weight:700;letter-spacing:-.015em}.card-title a{color:var(--text);text-decoration:none}.card-title a:hover{color:var(--blue);text-decoration:underline;text-underline-offset:3px}
  .card-ownership{padding:9px 0 3px}.card-ownership-label{margin:0 0 5px;color:#96a6b4;font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .card-facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:7px 0 0}.card-facts div{min-width:0;padding:9px 10px;background:#101822;border:1px solid #263746;border-radius:2px}
  .card-facts dt{color:#96a6b4;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.card-facts dd{margin:4px 0 0;font-size:13px;font-weight:650;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  @media(max-width:860px){.primary-controls{grid-template-columns:1fr 1fr}.primary-controls input[type=search]{grid-column:1/-1}.primary-controls .btn{width:100%}}
  @media(max-width:620px){header{padding-top:14px}.steam-brand{margin-bottom:9px}.steam-brand img{width:92px}.steam-hero{aspect-ratio:10/7;min-height:210px}.steam-hero::before{background-image:var(--steam-hero-art-mobile,var(--steam-hero-art));background-position:center top}.library-summary{padding:11px 13px 1px;margin-bottom:12px}.meta{margin-bottom:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.stat{padding:10px}.stat:last-child:nth-child(odd){grid-column:1/-1}.events-panel{grid-template-columns:1fr;gap:10px;padding:10px}.sale-countdown{min-height:0;padding:13px}.event-grid{grid-template-columns:1fr 1fr;gap:7px}.event-card{grid-template-columns:40px minmax(0,1fr);gap:8px;padding:8px}.event-art{width:40px;height:40px}.event-art svg{width:23px;height:23px}.event-kind{font-size:8px!important;letter-spacing:.06em}.event-card h3{font-size:12px}.primary-controls{grid-template-columns:1fr}.primary-controls input[type=search]{grid-column:auto}.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px}.wrap{padding-bottom:32px}table{display:none}.mobile-games{display:grid;gap:10px}.cover{width:80px;height:38px}}
  @media(max-width:380px){.event-grid{grid-template-columns:1fr}}
  @media(max-width:380px){.filter-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat small{font-size:9px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<script>
const STEAM_EVENTS = /*__STEAM_EVENTS__*/;
const safeSteamImage = value => {
  try {
    const url = new URL(value);
    return url.protocol === 'https:' && url.hostname.endsWith('.steamstatic.com') &&
      url.pathname.includes('/store_item_assets/steam/clusters/seasonalsales/') ? url.href : '';
  } catch { return ''; }
};
const saleArtwork = STEAM_EVENTS.artwork || {};
const saleDesktop = safeSteamImage(saleArtwork.desktop);
const saleMobile = safeSteamImage(saleArtwork.mobile);
if (saleDesktop) document.documentElement.style.setProperty('--steam-hero-art', 'url("' + saleDesktop.replace(/["\\]/g, '') + '")');
if (saleMobile) document.documentElement.style.setProperty('--steam-hero-art-mobile', 'url("' + saleMobile.replace(/["\\]/g, '') + '")');
</script>
<header>
  <div class="steam-brand" aria-label="Steam"><img src="https://store.akamai.steamstatic.com/public/shared/images/header/logo_steam.svg" alt="Steam"></div>
  <div class="steam-hero" role="img" aria-label="Arte de las ofertas estacionales actuales de Steam"></div>
  <section class="library-summary" aria-label="Resumen de tu biblioteca">
      <h1>Biblioteca <span>Steam</span></h1>
      <div class="meta" id="meta"></div>
      <div class="stats" id="stats"></div>
  </section>
  <section class="events-panel" aria-label="Ofertas y eventos de Steam">
    <div class="sale-countdown" id="saleCountdown" role="timer" aria-live="off"></div>
    <div class="events-content">
      <div class="events-heading"><h2>Festivales y eventos</h2><a class="event-source" id="scheduleSource" target="_blank" rel="noopener noreferrer">Fechas oficiales</a></div>
      <div class="event-grid" id="upcomingEvents"></div>
      <details class="events-more" id="allEventsDetails" hidden>
        <summary>Ver el calendario completo</summary>
        <div class="event-grid" id="allEvents"></div>
      </details>
    </div>
  </section>
  <div class="controls">
    <div class="primary-controls">
      <input type="search" id="q" placeholder="Buscar juego..." aria-label="Buscar en la biblioteca">
      <select id="account" aria-label="Filtrar por cuenta"></select>
      <select id="sort" aria-label="Ordenar juegos">
      <option value="hours-desc">Horas (mayor)</option>
      <option value="hours-asc">Horas (menor)</option>
      <option value="name-asc">Nombre A-Z</option>
      <option value="name-desc">Nombre Z-A</option>
      <option value="last-desc">Ultima vez (reciente)</option>
      <option value="first-desc">Vistos recientemente</option>
      <option value="first-asc">Vistos hace más tiempo</option>
      </select>
      <button class="btn" id="csv">Exportar CSV</button>
    </div>
    <div class="account-legend" id="accountLegend" aria-label="Avatares de tus cuentas"></div>
    <details class="advanced">
      <summary>Filtros adicionales</summary>
      <div class="filter-grid">
    <label class="chk"><input type="checkbox" id="backlog"> Solo backlog</label>
    <label class="chk"><input type="checkbox" id="multi"> En varias cuentas</label>
    <label class="chk"><input type="checkbox" id="family"> Con juegos de familia</label>
    <label class="chk"><input type="checkbox" id="wasted" title="Pagados, con precio, y 0 horas"> Sin jugar (pagados)</label>
    <label class="chk"><input type="checkbox" id="pending" title="Con logros por conseguir"> Logros pendientes</label>
    <label class="chk"><input type="checkbox" id="done" title="100% de logros"> 100% logros</label>
    <label class="chk">Mínimo de horas <input type="number" id="minh" min="0" step="1" aria-label="Mínimo de horas"></label>
      </div>
    </details>
  </div>
</header>
<div class="wrap">
  <div class="count" id="count" aria-live="polite"></div>
  <table>
    <caption class="sr-only">Biblioteca de juegos con cuentas, horas, precios, logros y fechas</caption>
    <thead>
      <tr>
        <th scope="col" data-sort="name"><button class="sort-button" type="button">Juego</button></th>
        <th scope="col">Cuentas</th>
        <th scope="col" class="num" data-sort="hours" title="Horas de tus cuentas; en juegos compartidos, horas informadas por Steam Families sin desglose personal"><button class="sort-button" type="button">Horas</button></th>
        <th scope="col" class="num" data-sort="price"><button class="sort-button" type="button">Precio</button></th>
        <th scope="col" class="num" data-sort="ach" title="Logros conseguidos / totales"><button class="sort-button" type="button">Logros</button></th>
        <th scope="col" class="num" data-sort="first"><button class="sort-button" type="button">Visto por primera vez</button></th>
        <th scope="col" class="num" data-sort="acquired" title="Steam Families solo informa adquisición para juegos compartidos"><button class="sort-button" type="button">Adquirido · familia</button></th>
        <th scope="col" class="num" data-sort="last"><button class="sort-button" type="button">Última vez</button></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <section class="mobile-games" id="mobileRows" aria-label="Juegos de la biblioteca"></section>
  <div class="empty" id="empty" hidden>Sin resultados con esos filtros.</div>
</div>
<button class="back-to-top" id="backToTop" type="button" aria-label="Volver arriba" title="Volver arriba" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
  <span>Arriba</span>
</button>

<script>
const DATA = /*__STEAM_DATA__*/;
const ACCOUNTS = DATA.accounts || [];
const GAMES = DATA.games || [];
const SCHEMA_V2 = Number(DATA.schema_version) >= 2;

// Bandera por cuenta (pais real) como SVG.
const FLAG_BY_ALIAS = {
  'y.roulin.tk': 'tr',
  'alain.roulin - mx': 'mx',
  'aln024 - cr': 'cr',
  'e]g[e > yves - cr': 'cr',
};
// Banderas de miembros de familia (se completan desde DATA.family_members).

const $ = s => document.querySelector(s);
const MOBILE_QUERY = window.matchMedia('(max-width: 620px)');
const backToTop = $('#backToTop');
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
function updateBackToTop() { backToTop.hidden = window.scrollY < 520; }
window.addEventListener('scroll', updateBackToTop, {passive:true});
backToTop.addEventListener('click', () => window.scrollTo({top:0, behavior:reducedMotion.matches ? 'auto' : 'smooth'}));
updateBackToTop();
const norm = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtH = n => { const v = Math.round((Number(n) || 0) * 10) / 10; return Number.isInteger(v) ? String(v) : v.toFixed(1); };
const steamEventDate = value => new Intl.DateTimeFormat(navigator.language || 'es', {
  day:'numeric', month:'short', hour:'numeric', minute:'2-digit', timeZoneName:'short'
}).format(new Date(value));
const steamEventRange = event => steamEventDate(event.start) + ' – ' + steamEventDate(event.end);
const eventUrl = 'https://store.steampowered.com/specials/';
const scheduleUrl = (STEAM_EVENTS.sources || []).slice(-1)[0] || 'https://partner.steamgames.com/doc/marketing/upcoming_events';
const EVENT_ART = {
  sale: '<svg viewBox="0 0 32 32"><path d="M18 4H7a3 3 0 0 0-3 3v11l11 10 13-13L18 4Z"/><circle cx="10" cy="10" r="1.5"/></svg>',
  festival: '<svg viewBox="0 0 32 32"><path d="m16 3 3.4 8.1L28 14l-8.6 2.9L16 26l-3.4-9.1L4 14l8.6-2.9L16 3Z"/><path d="m25 22 1.4 3.1L30 26l-3.6 1.2L25 31l-1.4-3.8L20 26l3.6-.9L25 22Z"/></svg>',
  cooking: '<svg viewBox="0 0 32 32"><path d="M5 14h19l-2 13H8L5 14Z"/><path d="M3 14h23M10 10c-2-2 2-3 0-6m7 6c-2-2 2-3 0-6m8 8 3-3"/></svg>',
  nextfest: '<svg viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="22" rx="3"/><path d="m13 11 9 5-9 5V11Z"/></svg>',
  halloween: '<svg viewBox="0 0 32 32"><path d="M24 20a11 11 0 1 1-12-15 9 9 0 0 0 12 15Z"/><path d="m23 5 .8 2.2L26 8l-2.2.8L23 11l-.8-2.2L20 8l2.2-.8L23 5Zm5 8 .6 1.4L30 15l-1.4.6L28 17l-.6-1.4L26 15l1.4-.6L28 13Z"/></svg>',
  racing: '<svg viewBox="0 0 32 32"><path d="M8 28V4m0 2h17l-4 5 4 5H8"/><path d="M8 6h8v5H8m8 0h9v5h-9"/></svg>'
};
function safeEventImage(value) {
  try {
    const url = new URL(value);
    const steamHost = url.hostname === 'steamstatic.com' || url.hostname.endsWith('.steamstatic.com');
    return url.protocol === 'https:' && steamHost && /^\/(store_item_assets|public)\//.test(url.pathname) ? url.href : '';
  } catch { return ''; }
}
function eventArtTheme(event) {
  const name = norm(event.name);
  if (event.type === 'sale') return 'sale';
  if (name.includes('cooking')) return 'cooking';
  if (name.includes('next fest')) return 'nextfest';
  if (name.includes('scream') || name.includes('halloween')) return 'halloween';
  if (name.includes('racing')) return 'racing';
  return 'festival';
}
$('#scheduleSource').href = scheduleUrl;
$('#scheduleSource').target = '_blank';
$('#scheduleSource').rel = 'noopener noreferrer';
$('#scheduleSource').title = 'Abrir el calendario oficial de eventos de Steamworks';
function eventCard(event, now) {
  const active = new Date(event.start) <= now && now < new Date(event.end);
  const sale = event.type === 'sale';
  const theme = eventArtTheme(event);
  const imageUrl = safeEventImage(event.image || (sale && active ? saleArtwork.desktop : ''));
  const image = imageUrl ? '<img class="event-art-image" src="' + esc(imageUrl) + '" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">' : '';
  return '<article class="event-card ' + (sale ? 'sale ' : '') + (active ? 'active' : '') + '">' +
    '<div class="event-art event-art-' + theme + '" aria-hidden="true">' + EVENT_ART[theme] + image + '</div>' +
    '<div class="event-copy">' +
    '<span class="event-kind">' + (active ? 'En curso' : sale ? 'Oferta estacional' : 'Festival temático') + '</span>' +
    '<h3>' + esc(event.name) + '</h3>' +
    '<p>' + esc(steamEventRange(event)) + '</p>' +
    '<p><a class="event-source" href="' + eventUrl + '" target="_blank" rel="noopener noreferrer">' + (sale ? 'Ver ofertas' : 'Ver eventos') + '</a></p>' +
    '</div>' +
  '</article>';
}
function renderSteamEvents(now = new Date()) {
  const events = (STEAM_EVENTS.events || []).filter(event => new Date(event.end) > now)
    .sort((a, b) => new Date(a.start) - new Date(b.start));
  $('#upcomingEvents').innerHTML = events.slice(0, 4).map(event => eventCard(event, now)).join('') ||
    '<p class="muted">No hay eventos próximos publicados.</p>';
  const remaining = events.slice(4);
  $('#allEventsDetails').hidden = remaining.length === 0;
  $('#allEvents').innerHTML = remaining.map(event => eventCard(event, now)).join('');
}
function updateSaleCountdown(now = new Date()) {
  const sales = (STEAM_EVENTS.events || []).filter(event => event.type === 'sale')
    .sort((a, b) => new Date(a.start) - new Date(b.start));
  const active = sales.find(event => new Date(event.start) <= now && now < new Date(event.end));
  const next = active || sales.find(event => new Date(event.start) > now);
  const panel = $('#saleCountdown');
  if (!next) {
    panel.innerHTML = '<span class="eyebrow">Ofertas estacionales</span><h2>Sin próxima fecha anunciada</h2><p>Steam todavía no publica la siguiente fecha.</p><a href="' + eventUrl + '" target="_blank" rel="noopener noreferrer">Ver ofertas en Steam</a>';
    return;
  }
  const target = new Date(active ? next.end : next.start);
  const seconds = Math.max(0, Math.floor((target - now) / 1000));
  const days = Math.floor(seconds / 86400);
  const hours = Math.floor((seconds % 86400) / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const remainder = seconds % 60;
  const countdown = days ? days + ' d · ' + String(hours).padStart(2, '0') + ' h · ' + String(minutes).padStart(2, '0') + ' min' :
    String(hours).padStart(2, '0') + ' h · ' + String(minutes).padStart(2, '0') + ' min · ' + String(remainder).padStart(2, '0') + ' s';
  panel.innerHTML = '<span class="eyebrow">' + (active ? 'La oferta termina en' : 'Próxima oferta estacional · empieza en') + '</span>' +
    '<h2>' + esc(next.name) + '</h2><p>' + countdown + '</p><p class="muted">' + esc(steamEventDate(target)) + '</p>' +
    '<a href="' + eventUrl + '" target="_blank" rel="noopener noreferrer">' + (active ? 'Ver ofertas en Steam' : 'Abrir la tienda Steam') + '</a>';
}
renderSteamEvents();
updateSaleCountdown();
setInterval(() => updateSaleCountdown(), 1000);
setInterval(() => renderSteamEvents(), 60000);
const flagFor = alias => FLAG_BY_ALIAS[alias] || '';
const flagImg = alias => {
  const cc = flagFor(alias);
  if (!cc) return '';
  return '<img class="flag" alt="' + esc(cc) + '" title="' + esc(alias) + '" loading="lazy" src="https://flagcdn.com/' + cc + '.svg">';
};
const flagCC = cc => cc
  ? '<img class="flag" alt="' + esc(cc) + '" loading="lazy" src="https://flagcdn.com/' + esc(String(cc).toLowerCase()) + '.svg">'
  : '';

const state = { q: '', account: '', sort: 'hours-desc', backlog: false, multi: false, family: false, wasted: false, pending: false, done: false, minh: 0 };

$('#meta').textContent =
  GAMES.length + ' juegos unicos | ' + ACCOUNTS.length + ' cuentas | actualizado ' +
  String(DATA.generated || '').slice(0,10) + ' (fuente: ' + (DATA.source || '-') + ')';

$('#stats').innerHTML = [
  ['Juegos', GAMES.length],
  ['Horas registradas', fmtH(GAMES.reduce((a, g) => a + (g.total_hours || 0), 0))],
  ['Backlog', GAMES.filter(g => !g.total_hours).length],
  ['En varias cuentas', GAMES.filter(g => g.owned_count > 1).length],
  ['Con familia', GAMES.filter(hasFamilyRelationship).length],
].map(p => '<div class="stat"><b>' + p[1] + '</b><small>' + p[0] + '</small></div>').join('');

const FAMILY = DATA.family_members || [];
const AVATAR_BY_ALIAS = Object.fromEntries(ACCOUNTS.map(account => [account.alias, safeSteamAvatar(account.avatar)]));
function safeSteamAvatar(value) {
  try {
    const url = new URL(value);
    return url.protocol === 'https:' && url.hostname.endsWith('.steamstatic.com') &&
      /\.(jpe?g|png|webp)$/i.test(url.pathname) ? url.href : '';
  } catch { return ''; }
}
function accountAvatar(alias) {
  const avatar = AVATAR_BY_ALIAS[alias] || '';
  const initial = esc((alias || '?').trim().charAt(0).toUpperCase());
  const fallback = '<span class="account-avatar-fallback"' + (avatar ? ' hidden' : '') + ' aria-hidden="true">' + initial + '</span>';
  const image = avatar
    ? '<img class="account-avatar" src="' + esc(avatar) + '" alt="" loading="lazy" referrerpolicy="no-referrer">'
    : '';
  return '<span class="account-avatar-shell">' + image + fallback + '</span>';
}
document.addEventListener('error', event => {
  const image = event.target;
  if (image instanceof HTMLImageElement && image.classList.contains('account-avatar')) {
    image.hidden = true;
    const fallback = image.nextElementSibling;
    if (fallback) fallback.hidden = false;
  }
}, true);
ACCOUNTS.forEach(a => { if (a.country) FLAG_BY_ALIAS[a.alias] = String(a.country).toLowerCase(); });
FAMILY.forEach(f => { if (f.country) FLAG_BY_ALIAS[f.alias] = String(f.country).toLowerCase(); });
$('#accountLegend').innerHTML = '<span class="account-legend-title">Mis cuentas</span>' +
  ACCOUNTS.map(account => '<span class="account-chip" data-account-alias="' + esc(account.alias) + '">' +
    accountAvatar(account.alias) + '<span>' + esc(account.alias) + '</span></span>').join('');
$('#account').innerHTML = '<option value="">Todas las cuentas</option>' +
  '<optgroup label="Mis cuentas">' +
    ACCOUNTS.map(a => '<option value="acc:' + esc(a.alias) + '">' + esc(a.personaname || a.alias) + ' (' + esc(a.alias) + ')</option>').join('') +
  '</optgroup>' +
  (FAMILY.length
    ? '<optgroup label="Familia (compartido)">' +
        FAMILY.map(f => '<option value="fam:' + esc(f.alias) + '">' + esc(f.alias) + '</option>').join('') +
      '</optgroup>'
    : '');

function familyOwners(game) {
  if (Array.isArray(game.family_owners)) return game.family_owners;
  const alias = game.family_owner;
  const owned = new Set(game.owned_accounts || Object.keys(game.accounts || {}));
  if (!alias || owned.has(alias)) return [];
  return [{alias, country: game.family_country}];
}

function hasFamilyRelationship(game) {
  if (SCHEMA_V2) return Boolean(game.family || familyOwners(game).length);
  return familyOwners(game).length > 0;
}

function current() {
  const qn = norm(state.q);
  let list = GAMES.filter(g => {
    if (state.account) {
      if (state.account.indexOf('fam:') === 0) {
        const owners = familyOwners(g);
        if (!owners.some(o => o.alias === state.account.slice(4))) return false;
      } else if (state.account.indexOf('acc:') === 0) {
        if (!(g.owned_accounts || Object.keys(g.accounts || {})).includes(state.account.slice(4))) return false;
      }
    }
    if (state.backlog && g.total_hours !== 0) return false;
    if (state.multi && !(g.owned_count > 1)) return false;
    if (state.family && !hasFamilyRelationship(g)) return false;
    if (state.wasted && !((g.price_usd > 0) && g.total_hours === 0)) return false;
    if (state.pending && !(g.achievements_total > 0 && g.achievements_got < g.achievements_total)) return false;
    if (state.done && !(g.achievements_total > 0 && g.achievements_got === g.achievements_total)) return false;
    if (state.minh && (g.total_hours || 0) < state.minh) return false;
    if (qn && norm(g.name).indexOf(qn) === -1) return false;
    return true;
  });
  const parts = state.sort.split('-');
  const key = parts[0], dir = parts[1];
  const mul = dir === 'asc' ? 1 : -1;
  list.sort((a, b) => {
    if (key === 'name') return a.name.localeCompare(b.name, 'es') * mul;
    if (key === 'last') return ((a.last_played || 0) - (b.last_played || 0)) * mul;
    if (key === 'acquired') return String(a.acquired || '').localeCompare(String(b.acquired || '')) * mul;
    if (key === 'first') return String(a.first_seen || '').localeCompare(String(b.first_seen || '')) * mul;
    if (key === 'price') return ((a.price_usd == null ? -1 : a.price_usd) - (b.price_usd == null ? -1 : b.price_usd)) * mul;
    if (key === 'ach') return ((a.achievements_total > 0 ? a.achievements_got / a.achievements_total : -1) - (b.achievements_total > 0 ? b.achievements_got / b.achievements_total : -1)) * mul;
    return ((a.total_hours || 0) - (b.total_hours || 0)) * mul;
  });
  return list;
}

function render() {
  document.querySelectorAll('.account-chip').forEach(chip => {
    chip.classList.toggle('selected', $('#account').value === 'acc:' + chip.dataset.accountAlias);
  });
  const list = current();
  $('#count').textContent = list.length + ' de ' + GAMES.length + ' juegos';
  $('#empty').hidden = list.length > 0;
  let html = '';
  let cards = '';
  for (const g of list) {
    const entries = Object.entries(g.accounts || {}).sort((a, b) => b[1] - a[1]);
    let badges = entries.map(function(e) {
      return '<span class="badge' + (g.owned_count > 1 ? ' multi' : '') + '" title="' + esc(e[0]) + '">' +
        accountAvatar(e[0]) + flagImg(e[0]) + esc(e[0]) + ' &middot; ' + fmtH(e[1]) + 'h</span>';
    }).join('');
    for (const alias of (g.owned_accounts || [])) {
      if (!(alias in (g.accounts || {}))) {
        badges += '<span class="badge">' + accountAvatar(alias) + esc(alias) + ' &middot; horas no disponibles</span>';
      }
    }
    {
      const owners = familyOwners(g);
      if (owners.length) {
        badges += owners.map(o => '<span class="badge fam" title="Compartido por Steam Families">' +
          flagCC(o.country) + 'FAMILIA: ' + esc(o.alias) + '</span>').join('');
      }
    }
    if (!badges) badges = '<span class="muted">-</span>';
    const id = esc(g.appid);
    const header = 'https://cdn.cloudflare.steamstatic.com/steam/apps/' + id + '/header.jpg';
    const icon = 'https://cdn.cloudflare.steamstatic.com/steamcommunity/public/images/apps/' + id + '/' + esc(g.img_icon_url || '') + '.jpg';
    const initial = esc((g.name || '?').trim().charAt(0).toUpperCase());
    const ph = '<span class="cover ph" title="Sin caratula">' + initial + '</span>';
    const cover = g.img_icon_url
      ? '<img class="cover" loading="lazy" alt="" src="' + header + '" onerror="this.onerror=null;this.src=\'' + icon + '\';this.classList.add(\'icon\')">'
      : '<img class="cover" loading="lazy" alt="" src="' + header + '" onerror="this.replaceWith(document.createRange().createContextualFragment(this.dataset.ph))" data-ph="' + ph.replace(/"/g, '&quot;') + '">';

    const priceTxt = g.price_usd == null ? '<span class="muted">-</span>'
      : (g.is_free ? '<span class="muted">Gratis</span>' : '$' + fmtH(g.price_usd));
    const achTxt = (g.achievements_total > 0)
      ? (g.achievements_got + '/' + g.achievements_total + ' <span class="pct">' + (g.achievements_pct || 0) + '%</span>')
      : '<span class="muted">-</span>';

    const gameLink = '<a class="game" target="_blank" rel="noopener" href="https://store.steampowered.com/app/' + id + '/">' + esc(g.name) + '</a>';
    const hoursText = fmtH(g.total_hours) + (g.hours_source === 'family' ? ' <span class="pct">familia</span>' : '');
    const firstSeenText = g.first_seen ? esc(g.first_seen) : '<span class="muted">Se registra al actualizar</span>';
    const acquiredText = g.acquired ? esc(g.acquired) : '<span class="muted">-</span>';
    const lastPlayedText = g.last_played_iso ? esc(g.last_played_iso) : 'Nunca';
    html += '<tr>' +
      '<td class="gameCell" data-label="Juego"><div class="game-cell-content">' + cover +
        '<span class="gmeta"><span class="game">' + gameLink + '</span>' +
        '<div class="appid">' + id + '</div></span></div></td>' +
      '<td data-label="Cuentas">' + badges + '</td>' +
      '<td class="num ' + (g.total_hours ? 'hours' : 'zero') + '" data-label="Horas" title="' +
        (g.hours_source === 'family' ? 'Steam Families: sin desglose por jugador' : 'Horas registradas por cuenta') + '">' +
        hoursText + '</td>' +
      '<td class="num" data-label="Precio">' + priceTxt + '</td>' +
      '<td class="num ' + (g.achievements_total > 0 ? '' : 'muted') + '" data-label="Logros">' + achTxt + '</td>' +
      '<td class="num ' + (g.first_seen ? '' : 'muted') + '" data-label="Visto por primera vez">' + firstSeenText + '</td>' +
      '<td class="num ' + (g.acquired ? '' : 'muted') + '" data-label="Adquirido · familia">' + acquiredText + '</td>' +
      '<td class="num ' + (g.last_played_iso ? '' : 'muted') + '" data-label="Última vez">' + lastPlayedText + '</td>' +
      '</tr>';
    const firstFact = '<div><dt>Visto por primera vez</dt><dd>' + firstSeenText + '</dd></div>';
    const acquiredFact = g.acquired ? '<div><dt>Adquirido · familia</dt><dd>' + acquiredText + '</dd></div>' : '';
    const achievementFact = '<div><dt>Logros</dt><dd>' + achTxt + '</dd></div>';
    cards += '<article class="game-card"><div class="card-head">' + cover +
      '<div class="gmeta"><h2 class="card-title">' + gameLink + '</h2><div class="appid">App ' + id + '</div></div></div>' +
      '<div class="card-ownership"><p class="card-ownership-label">Cuentas y biblioteca familiar</p>' + badges + '</div>' +
      '<dl class="card-facts"><div><dt>Horas registradas</dt><dd class="' + (g.total_hours ? 'hours' : 'zero') + '">' + hoursText + '</dd></div>' +
      '<div><dt>Precio actual</dt><dd>' + priceTxt + '</dd></div>' + achievementFact + firstFact + acquiredFact +
      '<div><dt>Última vez</dt><dd>' + lastPlayedText + '</dd></div></dl></article>';
  }
  $('#rows').innerHTML = MOBILE_QUERY.matches ? '' : html;
  $('#mobileRows').innerHTML = MOBILE_QUERY.matches ? cards : '';
}

function exportCsv() {
  const list = current();
  const e2 = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const lines = [['appid','nombre','horas_total','cuentas_propias','horas_por_cuenta','solo_compartido','duenos_familia','precio_usd','logros_obtenidos','logros_totales','logros_pct','primera_vez_visto','adquirido_familia','ultima_vez','fuente_horas'].map(e2).join(',')];
  for (const g of list) {
    const per = Object.entries(g.accounts || {}).map(e => e[0] + '=' + e[1] + 'h').join(' | ');
    lines.push([g.appid, g.name, g.total_hours, g.owned_count, per, SCHEMA_V2 ? (g.family ? 'si' : 'no') : '', familyOwners(g).map(o => o.alias).join(' | '), (g.price_usd == null ? '' : g.price_usd), g.achievements_got ?? '', g.achievements_total ?? '', (g.achievements_pct == null ? '' : g.achievements_pct), g.first_seen || '', g.acquired || '', g.last_played_iso || '', g.hours_source || ''].map(e2).join(','));
  }
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'steam_filtrado.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

const on = (el, ev, fn) => el.addEventListener(ev, fn);
function syncSortHeader() {
  const [key, direction] = state.sort.split('-');
  document.querySelectorAll('th[data-sort]').forEach(th => {
    if (th.dataset.sort === key) th.setAttribute('aria-sort', direction === 'asc' ? 'ascending' : 'descending');
    else th.removeAttribute('aria-sort');
  });
}
on($('#q'), 'input', e => { state.q = e.target.value; render(); });
on($('#account'), 'change', e => { state.account = e.target.value; render(); });
on($('#sort'), 'change', e => { state.sort = e.target.value; syncSortHeader(); render(); });
on($('#backlog'), 'change', e => { state.backlog = e.target.checked; render(); });
on($('#multi'), 'change', e => { state.multi = e.target.checked; render(); });
on($('#family'), 'change', e => { state.family = e.target.checked; render(); });
on($('#wasted'), 'change', e => { state.wasted = e.target.checked; render(); });
on($('#pending'), 'change', e => { state.pending = e.target.checked; render(); });
on($('#done'), 'change', e => { state.done = e.target.checked; render(); });
on($('#minh'), 'input', e => { state.minh = Number(e.target.value) || 0; render(); });
on($('#csv'), 'click', exportCsv);
MOBILE_QUERY.addEventListener('change', render);
document.querySelectorAll('th[data-sort]').forEach(th => on(th, 'click', () => {
  const k = th.dataset.sort;
  state.sort = k === 'name' ? (state.sort === 'name-asc' ? 'name-desc' : 'name-asc')
    : (state.sort === k + '-desc' ? k + '-asc' : k + '-desc');
  $('#sort').value = state.sort;
  syncSortHeader();
  render();
}));

syncSortHeader();
render();
</script>
</body>
</html>
