name: Actualizar biblioteca Steam

on:
  schedule:
    # Todos los dias a las 15:00 UTC (~09:00 Costa Rica). Ajusta a tu gusto.
    - cron: "0 15 * * *"
  workflow_dispatch:   # permite ejecutarlo a mano desde la pestana Actions
  push:
    branches: [main]
    # Evita bucle infinito: NO disparar cuando el bot actualiza los datos.
    paths-ignore:
      - 'steam_games.json'
      - 'steam_games.md'
      - 'steam_games.html'
      - 'genres_cache.json'
      - 'steam_artwork.json'

concurrency:
  group: "steam-tracker"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # para poder commitear los datos actualizados
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar pruebas antes de consultar Steam
        run: python -m unittest discover -s tests -v

      - uses: actions/cache@v4
        with:
          path: meta_cache.json
          key: steam-meta-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: steam-meta-v2-

      - uses: actions/cache@v4
        with:
          path: steam_history.json
          key: steam-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: steam-history-v1-

      - name: Escribir accounts.json desde el secreto
        env:
          ACCOUNTS_JSON: ${{ secrets.STEAM_ACCOUNTS_JSON }}
        run: |
          if [ -z "$ACCOUNTS_JSON" ]; then
            echo "::error::Falta el secreto STEAM_ACCOUNTS_JSON en Settings > Secrets and variables > Actions"
            exit 1
          fi
          printf '%s' "$ACCOUNTS_JSON" > accounts.json

      - name: Actualizar cuentas, familia, precios, logros y web
        run: python update.py --sleep-ms 250 --price-cache-days 7 --achievement-cache-days 7

      - name: Eliminar configuración temporal
        if: always()
        run: rm -f accounts.json

      - name: Preparar sitio para Pages
        run: |
          mkdir -p _site
          cp steam_games.html _site/index.html
          cp steam_games.md   _site/
          cp steam_games.json _site/

      - name: Guardar cambios en el repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add steam_games.md steam_games.json steam_games.html steam_artwork.json
          git diff --staged --quiet || git commit -m "Actualizar biblioteca Steam ($(date -u +%Y-%m-%d)) [skip ci]"
          git push

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write         # publicar en Pages
      id-token: write      # OIDC para el deploy de Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
